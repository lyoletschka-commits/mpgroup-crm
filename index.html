<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>CRM · MP Group</title>
<style>
  :root {
    --bg: #f6f5f1; --card: #ffffff; --ink: #1f2a37; --muted: #6b7280; --line: #e5e2da;
    --accent: #2f3b4c; --gold: #b8932f; --soft: #f0ede4;
    --s-contacted: #2563eb; --s-callback: #d97706; --s-agreed: #15803d; --s-refused: #b91c1c; --s-no_answer: #6b7280;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { background: var(--accent); color: #fff; padding: 14px 20px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: .2px; }
  header h1 span { color: #e6cf86; }
  header .sp { flex: 1; }
  header button { background: transparent; color: #cbd5e1; border: 1px solid #475569; border-radius: 8px; padding: 6px 10px; cursor: pointer; }
  main { max-width: 1400px; margin: 0 auto; padding: 16px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .chip { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer; user-select: none; }
  .chip b { margin-left: 4px; }
  .chip.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .filters input, .filters select { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); font: inherit; }
  .filters input { flex: 1; min-width: 200px; }
  table { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  th { text-align: left; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .4px; color: var(--muted); background: var(--soft); padding: 10px; border-bottom: 1px solid var(--line); }
  td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  tr.due td { background: #fff8ea; }
  a { color: var(--accent); }
  .num a { font-weight: 700; font-size: 15px; text-decoration: none; border-bottom: 2px solid var(--gold); }
  .src { display: block; font-size: 12px; color: var(--muted); margin-top: 4px; }
  .muted { color: var(--muted); font-size: 12px; }
  .obj b { display: block; }
  .tag { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 6px; background: var(--soft); margin-right: 4px; }
  .tag.sale { background: #e8eefc; } .tag.rent { background: #e9f6ee; }
  select.st { padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); font: inherit; font-weight: 600; background: #fff; max-width: 170px; }
  select.st[data-v="contacted"] { color: var(--s-contacted); } select.st[data-v="callback"] { color: var(--s-callback); }
  select.st[data-v="agreed"] { color: var(--s-agreed); } select.st[data-v="refused"] { color: var(--s-refused); }
  select.st[data-v="no_answer"] { color: var(--s-no_answer); }
  input.dt { padding: 5px 6px; border: 1px solid var(--line); border-radius: 8px; font: inherit; font-size: 12px; margin-top: 6px; max-width: 170px; }
  .edit { cursor: pointer; border-bottom: 1px dashed #c9c3b5; }
  .edit:hover { background: var(--soft); }
  .ex { cursor: pointer; font-size: 12px; margin-top: 4px; display: inline-block; color: var(--muted); }
  .ex.on { color: var(--gold); font-weight: 600; }
  .notes { max-width: 380px; }
  .note { margin-bottom: 6px; }
  .note .muted { margin-right: 6px; }
  details summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  .add { display: flex; gap: 6px; margin-top: 6px; }
  .add textarea { flex: 1; min-height: 34px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; font: inherit; resize: vertical; }
  .add button, .login button { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 6px 12px; cursor: pointer; font: inherit; }
  .login { max-width: 360px; margin: 80px auto; background: var(--card); padding: 24px; border-radius: 12px; border: 1px solid var(--line); }
  .login input { width: 100%; padding: 10px; margin: 12px 0; border: 1px solid var(--line); border-radius: 8px; font: inherit; }
  #toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--accent); color: #fff; padding: 8px 14px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.show { opacity: 1; }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
  @media (max-width: 820px) {
    main { padding: 10px; }
    table, thead, tbody, tr, td { display: block; width: 100%; }
    thead { display: none; }
    table { border: 0; background: transparent; }
    tr { background: var(--card); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 10px; padding: 4px 0; }
    td { border: 0; padding: 6px 12px; }
    .notes { max-width: none; }
  }
</style>
</head>
<body>
<header>
  <h1>CRM · <span>MP Group</span></h1>
  <div class="sp"></div>
  <span id="count" class="muted" style="color:#cbd5e1"></span>
  <button id="reload" title="Обновить">↻ Обновить</button>
  <button id="logout" title="Выйти на этом устройстве">Выйти</button>
</header>
<main id="app"></main>
<div id="toast"></div>
<script>
const API = "https://vfuqyhnbvmpkxjeuvujy.supabase.co/functions/v1/crm";
const TZ = "Europe/Madrid";
const STATUS = {
  contacted: "📞 Написал", callback: "🔁 Перезвонить", agreed: "🤝 Договорились",
  no_answer: "🚫 Не отвечает", refused: "❌ Отказ",
};
const app = document.getElementById("app");
let rows = [];
const ui = { chip: "active", q: "", op: "", sort: "updated" };

function store(k, v) { try { v === undefined ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} }
function load(k) { try { return localStorage.getItem(k); } catch { return null; } }

// The bot opens this page with #k=<key>; keep the key on this device and drop it from the address bar.
const fromHash = new URLSearchParams(location.hash.slice(1)).get("k");
if (fromHash) { store("crmKey", fromHash); history.replaceState(null, "", location.pathname); }
let key = load("crmKey") || fromHash;

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (iso, opts = { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) =>
  iso ? new Intl.DateTimeFormat("ru-RU", { timeZone: TZ, ...opts }).format(new Date(iso)) : "";
const price = (r) => r.price == null ? "цена по запросу" : r.price.toLocaleString("ru-RU") + " €" + (r.operation === "rent" ? "/мес" : "");
function toast(t) { const el = document.getElementById("toast"); el.textContent = t; el.classList.add("show"); setTimeout(() => el.classList.remove("show"), 1600); }
function localInput(iso) {
  if (!iso) return "";
  const d = new Date(iso); const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}
function endOfToday() { const d = new Date(); d.setHours(23, 59, 59, 999); return d; }
const isDue = (r) => r.crm_status === "callback" && r.callback_at && new Date(r.callback_at) <= endOfToday();

async function api(method, body) {
  const res = await fetch(API, {
    method, headers: { "x-crm-key": key, ...(body ? { "content-type": "application/json" } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (res.status === 403) { store("crmKey"); key = null; renderLogin("Ключ не подошёл. Откройте таблицу из бота командой /crm."); throw new Error("forbidden"); }
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.status);
  return res.json();
}

async function refresh() {
  app.innerHTML = '<div class="empty">Загружаю…</div>';
  try { rows = (await api("GET")).rows; render(); } catch (e) { if (key) app.innerHTML = `<div class="empty">Ошибка: ${esc(e.message)}</div>`; }
}

async function save(id, action, value, msg) {
  try { await api("POST", { id, action, value }); toast(msg || "Сохранено"); } catch (e) { toast("Не сохранилось: " + e.message); throw e; }
}

function renderLogin(note) {
  app.innerHTML = `<div class="login"><b>CRM · MP Group</b>
    <p class="muted">${esc(note || "Откройте таблицу из бота командой /crm — ключ подставится сам. Или вставьте ключ доступа.")}</p>
    <input id="k" type="password" placeholder="Ключ доступа" autocomplete="off"><button id="go">Войти</button></div>`;
  document.getElementById("go").onclick = () => { key = document.getElementById("k").value.trim(); if (key) { store("crmKey", key); refresh(); } };
}

const CHIPS = [
  ["active", "В работе", (r) => r.crm_status && r.crm_status !== "refused"],
  ["due", "⏰ Перезвонить сегодня", isDue],
  ["new", "Не связывался", (r) => !r.crm_status],
  ...Object.entries(STATUS).map(([k, l]) => [k, l, (r) => r.crm_status === k]),
  ["excl", "💎 Эксклюзив", (r) => r.crm_exclusive],
  ["all", "Все", () => true],
];

function visible() {
  const pred = CHIPS.find((c) => c[0] === ui.chip)[2];
  const q = ui.q.toLowerCase();
  const list = rows.filter((r) => pred(r) && (!ui.op || r.operation === ui.op) && (!q ||
    [r.id, r.location, r.title, r.advertiser_name, r.owner_phone, ...r.notes.map((n) => n.text)].join(" ").toLowerCase().includes(q)));
  const by = {
    updated: (a, b) => (b.crm_updated_at || b.created_at).localeCompare(a.crm_updated_at || a.created_at),
    callback: (a, b) => (a.callback_at || "9").localeCompare(b.callback_at || "9"),
    newest: (a, b) => b.created_at.localeCompare(a.created_at),
  }[ui.sort];
  return list.sort(by);
}

function render() {
  const chips = CHIPS.map(([k, l, p]) => `<span class="chip ${ui.chip === k ? "on" : ""}" data-chip="${k}">${l}<b>${rows.filter(p).length}</b></span>`).join("");
  const list = visible();
  document.getElementById("count").textContent = `${rows.length} объектов`;
  app.innerHTML = `<div class="chips">${chips}</div>
    <div class="filters">
      <input id="q" placeholder="Поиск: номер, город, имя, телефон, заметка" value="${esc(ui.q)}">
      <select id="op"><option value="">Продажа и аренда</option><option value="sale" ${ui.op === "sale" ? "selected" : ""}>Продажа</option><option value="rent" ${ui.op === "rent" ? "selected" : ""}>Аренда</option></select>
      <select id="sort"><option value="updated">Сначала недавние действия</option><option value="callback" ${ui.sort === "callback" ? "selected" : ""}>По дате «перезвонить»</option><option value="newest" ${ui.sort === "newest" ? "selected" : ""}>Сначала новые объявления</option></select>
    </div>
    ${list.length ? `<table><thead><tr><th>№</th><th>Объект</th><th>Владелец</th><th>Статус</th><th>Заметки</th></tr></thead>
    <tbody>${list.map(rowHtml).join("")}</tbody></table>` : '<div class="empty">Здесь пока пусто</div>'}`;
  bind();
}

function rowHtml(r) {
  const srcName = r.source === "idealista" ? "Idealista" : "Fotocasa";
  const srcLink = r.link !== r.url ? `<a class="src" href="${esc(r.url)}" target="_blank" rel="noopener">${srcName} ↗</a>` : `<span class="src">${srcName}</span>`;
  const notes = r.notes;
  return `<tr data-id="${r.id}" class="${isDue(r) ? "due" : ""}">
    <td class="num"><a href="${esc(r.link)}" target="_blank" rel="noopener">№${r.id}</a>${srcLink}<span class="muted">${fmt(r.created_at, { day: "numeric", month: "short" })}</span></td>
    <td class="obj"><span class="tag ${r.operation}">${r.operation === "rent" ? "Аренда" : "Продажа"}</span>${r.status === "posted" ? '<span class="tag">в группе</span>' : ""}
      <b>${esc(r.location || "—")}</b>${esc(price(r))}<div class="muted">${esc(r.title || "")}</div></td>
    <td>
      <div><span class="edit" data-field="name">${esc(r.advertiser_name || "+ имя")}</span></div>
      <div>${r.owner_phone ? `<a href="tel:${esc(r.owner_phone.replace(/\s/g, ""))}">☎️</a> ` : ""}<span class="edit" data-field="phone">${esc(r.owner_phone || "+ телефон")}</span></div>
      <div class="muted">Комиссия: <span class="edit" data-field="commission">${esc(r.crm_commission || "—")}</span></div>
      <span class="ex ${r.crm_exclusive ? "on" : ""}">💎 ${r.crm_exclusive ? "Эксклюзив" : "не эксклюзив"}</span>
    </td>
    <td>
      <select class="st" data-v="${r.crm_status || ""}"><option value="">— не связывался</option>${Object.entries(STATUS).map(([k, l]) => `<option value="${k}" ${r.crm_status === k ? "selected" : ""}>${l}</option>`).join("")}</select>
      ${r.crm_status === "callback" ? `<div><input class="dt" type="datetime-local" value="${localInput(r.callback_at)}"></div>` : ""}
      ${r.crm_updated_at ? `<div class="muted">изм. ${fmt(r.crm_updated_at)}</div>` : ""}
    </td>
    <td class="notes">
      ${notes.slice(0, 2).map((n) => `<div class="note"><span class="muted">${fmt(n.created_at)}</span>${esc(n.text)}</div>`).join("")}
      ${notes.length > 2 ? `<details><summary>ещё ${notes.length - 2}</summary>${notes.slice(2).map((n) => `<div class="note"><span class="muted">${fmt(n.created_at)}</span>${esc(n.text)}</div>`).join("")}</details>` : ""}
      <div class="add"><textarea placeholder="Новая заметка…" rows="1"></textarea><button>＋</button></div>
    </td>
  </tr>`;
}

function bind() {
  app.querySelectorAll("[data-chip]").forEach((el) => el.onclick = () => { ui.chip = el.dataset.chip; render(); });
  const q = document.getElementById("q");
  q.oninput = () => { ui.q = q.value; const pos = q.selectionStart; render(); const n = document.getElementById("q"); n.focus(); n.setSelectionRange(pos, pos); };
  document.getElementById("op").onchange = (e) => { ui.op = e.target.value; render(); };
  document.getElementById("sort").onchange = (e) => { ui.sort = e.target.value; render(); };
  app.querySelectorAll("tr[data-id]").forEach((tr) => {
    const id = Number(tr.dataset.id); const r = rows.find((x) => x.id === id);
    const touch = () => { r.crm_updated_at = new Date().toISOString(); };
    tr.querySelector("select.st").onchange = async (e) => {
      const v = e.target.value;
      if (v === "callback") {
        const d = new Date(); d.setDate(d.getDate() + 1); d.setHours(10, 0, 0, 0);
        await save(id, "callback", d.toISOString(), "Напомню завтра в 10:00");
        r.crm_status = "callback"; r.callback_at = d.toISOString();
      } else { await save(id, "status", v || null); r.crm_status = v || null; }
      touch(); render();
    };
    const dt = tr.querySelector("input.dt");
    if (dt) dt.onchange = async () => { if (!dt.value) return; const iso = new Date(dt.value).toISOString(); await save(id, "callback", iso, "Напоминание: " + fmt(iso)); r.callback_at = iso; touch(); render(); };
    tr.querySelectorAll(".edit").forEach((el) => el.onclick = async () => {
      const f = el.dataset.field; const col = { name: "advertiser_name", phone: "owner_phone", commission: "crm_commission" }[f];
      const v = prompt({ name: "Имя владельца", phone: "Телефон владельца", commission: "Комиссия" }[f], r[col] || "");
      if (v === null) return; await save(id, "field", { field: f, text: v }); r[col] = v.trim() || null; touch(); render();
    });
    tr.querySelector(".ex").onclick = async () => { await save(id, "exclusive", !r.crm_exclusive); r.crm_exclusive = !r.crm_exclusive; touch(); render(); };
    const ta = tr.querySelector("textarea"); const add = async () => {
      const t = ta.value.trim(); if (!t) return; await save(id, "note", t, "Заметка сохранена");
      r.notes.unshift({ text: t, created_at: new Date().toISOString() }); touch(); render();
    };
    tr.querySelector(".add button").onclick = add;
    ta.onkeydown = (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) add(); };
  });
}

document.getElementById("reload").onclick = refresh;
document.getElementById("logout").onclick = () => { store("crmKey"); key = null; renderLogin(); };
key ? refresh() : renderLogin();
</script>
</body>
</html>
